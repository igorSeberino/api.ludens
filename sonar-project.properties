# SonarQube Cloud: análise do monorepo (apps/api e apps/web) num projeto só.
# Organização e chave são as que o SonarQube Cloud gera ao importar o repo do
# GitHub; conferir em Administration > Project settings se forem diferentes.
sonar.organization=igorseberino
sonar.projectKey=igorSeberino_app.ludens
sonar.projectName=ludens

sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/tests,apps/web/src,apps/web/__tests__,apps/web/tests
sonar.test.inclusions=apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,apps/web/__tests__/**,apps/web/tests/**,apps/api/tests/**
sonar.exclusions=apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx
# Migrations do Alembic são geradas e não entram em cobertura nem duplicação.
sonar.coverage.exclusions=apps/api/src/migrations/**
sonar.cpd.exclusions=apps/api/src/migrations/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=apps/api/coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

sonar.sourceEncoding=UTF-8
