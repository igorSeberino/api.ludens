name: SonarQube

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o Sonar usa o blame para separar código novo.
          fetch-depth: 0

      - name: Start Postgres
        run: docker compose -f apps/api/docker/docker-compose.Staging.yml up -d

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API coverage
        working-directory: apps/api
        run: |
          pip install ".[dev]"
          pytest -q --cov=app --cov-report=xml:coverage.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Web coverage
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx jest --coverage --coverageReporters=lcov
          # Jest grava caminhos relativos a apps/web; o Sonar lê a partir da raiz.
          sed -i 's|^SF:|SF:apps/web/|' coverage/lcov.info

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Stop Postgres
        if: always()
        run: docker compose -f apps/api/docker/docker-compose.Staging.yml down
